<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>口コミを投稿｜まちリスト</title>
    <meta name="description" content="まちリストに掲載されている店舗の口コミを投稿できます。">
    <link rel="canonical" href="https://machi-list.jp/review.html">
    <link rel="stylesheet" href="./assets/styles.css">
    <meta name="robots" content="noindex, follow">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="まちリスト ホーム">
        <span class="brand-mark">M</span>
        <span>
          <strong>まちリスト</strong>
          <small>市区町村とジャンルで探す店舗一覧</small>
        </span>
      </a>
      <nav class="nav" aria-label="主なページ">
        <a href="./">トップ</a>
      </nav>
    </header>

    <main>
      <section class="review-form-shell">
        <div class="map-search-head">
          <p class="eyebrow">口コミ投稿</p>
          <h1 id="shop-name-heading">店舗の口コミを投稿</h1>
          <p id="shop-context">対象の店舗ページから「口コミを投稿」を押してご利用ください。</p>
        </div>

        <form id="review-form" action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="POST" class="review-form">
          <input type="hidden" name="shop_id" id="field-shop-id">
          <input type="hidden" name="shop_name" id="field-shop-name">
          <input type="hidden" name="area_key" id="field-area-key">
          <input type="hidden" name="genre_key" id="field-genre-key">

          <label>
            お名前・ニックネーム
            <input type="text" name="nickname" required maxlength="30" placeholder="例: 名古屋在住">
          </label>

          <label>
            評価
            <select name="rating" required>
              <option value="">選択してください</option>
              <option value="5">★★★★★（5）</option>
              <option value="4">★★★★☆（4）</option>
              <option value="3">★★★☆☆（3）</option>
              <option value="2">★★☆☆☆（2）</option>
              <option value="1">★☆☆☆☆（1）</option>
            </select>
          </label>

          <label>
            口コミ本文
            <textarea name="body" required maxlength="600" rows="6" placeholder="来店した感想、良かった点、気になった点などをご記入ください。"></textarea>
          </label>

          <p class="review-form-note">投稿内容は運営が確認のうえ、順次サイトに反映します。個人が特定される情報の記載はお控えください。</p>

          <button type="submit" class="button">口コミを投稿する</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 まちリスト</p>
      <p><a href="./llms.txt">llms.txt</a> <a href="./sitemap.xml">sitemap.xml</a></p>
    </footer>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const shopId = params.get("shop_id") || "";
        const shopName = params.get("shop_name") || "";
        const areaKey = params.get("area_key") || "";
        const genreKey = params.get("genre_key") || "";

        document.getElementById("field-shop-id").value = shopId;
        document.getElementById("field-shop-name").value = shopName;
        document.getElementById("field-area-key").value = areaKey;
        document.getElementById("field-genre-key").value = genreKey;

        if (shopName) {
          document.getElementById("shop-name-heading").textContent = `${shopName}の口コミを投稿`;
          document.getElementById("shop-context").textContent = `「${shopName}」への口コミとして投稿されます。`;
        }
      })();
    </script>
  </body>
</html>
